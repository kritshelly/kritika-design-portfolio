<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><defs><linearGradient id="glass" x2="1" y2="1"><stop stop-color="#393939"/><stop offset="1" stop-color="#181818"/></linearGradient><linearGradient id="signature" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFD5BB"/><stop offset=".48" stop-color="#FF7A36"/><stop offset="1" stop-color="#FF642D"/></linearGradient></defs><rect x="0" y="0" width="1280" height="800" rx="28" fill="#101010" stroke="none"/><text x="40" y="54.0" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="600" fill="#FFF7EF">SETGO /</text><text x="1060" y="49.0" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="500" fill="#FFD5BB">PARK  •  09:41</text><rect x="40" y="80" width="1200" height="1" rx="0" fill="#494949" stroke="none"/><text x="40" y="125.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" fill="#C9C9C9">GET SET. THEN GO.</text><text x="40" y="202.0" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="500" fill="#FFF7EF">Find your wipers.</text><text x="42" y="302.0" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#C9C9C9">Locate the wiper stalk to the right of the steering wheel.</text><rect x="40" y="365" width="645" height="84" rx="16" fill="url(#glass)" stroke="#494949"/><text x="60" y="400.0" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="500" fill="#FFF7EF">Learn, then return</text><text x="60" y="426.0" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#C9C9C9">This illustration is for the SETGO concept vehicle. Actual vehicles</text><text x="60" y="446.48" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#C9C9C9">vary.</text><rect x="40" y="461" width="645" height="84" rx="16" fill="url(#glass)" stroke="#494949"/><text x="60" y="496.0" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="500" fill="#FFF7EF">Need detailed instructions?</text><text x="60" y="522.0" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#C9C9C9">Ask the rental team to demonstrate the control.</text><rect x="735" y="140" width="505" height="512" rx="24" fill="url(#glass)" stroke="none"/><text x="765" y="181.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" fill="#C9C9C9">YOUR SPACE / YOUR PACE</text><svg x="780" y="250" width="400" height="240" viewBox="0 0 400 240"><rect x="18" y="35" width="365" height="172" rx="35" fill="#101010" stroke="#494949" stroke-width="3"/><path d="M35 91 H365" stroke="#494949" stroke-width="3"/><rect x="80" y="99" width="97" height="57" rx="10" fill="#242424" stroke="#B9B9B9" stroke-width="2"/><circle cx="282" cy="126" r="49" fill="#242424" stroke="#C9C9C9" stroke-width="6"/><path d="M238 118 L272 134 L280 171 M323 118 L291 134" fill="none" stroke="#C9C9C9" stroke-width="5"/><rect x="186" y="110" width="34" height="25" rx="7" fill="#494949"/><rect x="335" y="112" width="32" height="10" rx="5" fill="#FF7A36"/><rect x="191" y="160" width="26" height="33" rx="8" fill="#494949"/><path d="M281 14 V30" stroke="#FFD5BB" stroke-width="4"/></svg><text x="765" y="547.0" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" fill="#FF7A36">WIPER STALK</text><text x="765" y="584.0" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" fill="#C9C9C9">Illustrative vehicle layout. Follow the</text><text x="765" y="605.76" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" fill="#C9C9C9">handbook supplied with your car.</text><rect x="40" y="690" width="1200" height="1" rx="0" fill="#494949" stroke="none"/><rect x="40" y="710" width="112" height="64" rx="14" fill="#242424"/><text x="96.0" y="749" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" fill="#FFF7EF">Back</text><rect x="920" y="710" width="320" height="64" rx="14" fill="#FF7A36"/><text x="1080.0" y="749" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" fill="#101010">Back to essentials</text><rect x="180" y="710" width="380" height="64" rx="14" fill="#242424"/><text x="370.0" y="749" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" fill="#FFF7EF">Ask for help</text><text x="750" y="750.0" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#C9C9C9">2 / 5</text><rect x="765" y="205" width="445" height="5" rx="2.5" fill="url(#signature)"/></svg>