<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><defs><linearGradient id="sun" x2="1" y2="1"><stop stop-color="#FFD5BB"/><stop offset=".55" stop-color="#FF7A36"/><stop offset="1" stop-color="#FF642D"/></linearGradient><linearGradient id="glass" x2="1" y2="1"><stop stop-color="#353535"/><stop offset="1" stop-color="#191919"/></linearGradient></defs><rect x="0" y="0" width="390" height="844" rx="36" fill="#101010"/><text x="24" y="31.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#FFF7EF">9:41</text><text x="315" y="31.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#FFF7EF">● ▰</text><text x="24" y="88.0" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600" fill="#FFF7EF">SETGO /</text><text x="314" y="85.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#FFD5BB">02 / 04</text><text x="24" y="150.0" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="500" fill="#FFF7EF">A little</text><text x="24" y="195.9" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="500" fill="#FFF7EF">preparation.</text><text x="24" y="228.0" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#C9C9C9">Choose what you would like to explore</text><text x="24" y="248.25" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#C9C9C9">first.</text><rect x="24" y="280" width="342" height="100" rx="20" fill="url(#glass)"/><text x="43" y="310.0" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#FF7A36">01</text><text x="43" y="339.0" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="400" fill="#FFF7EF">Get comfortable</text><text x="43" y="363.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#C9C9C9">Seat, mirrors and cabin temperature</text><rect x="24" y="397" width="342" height="100" rx="20" fill="url(#glass)"/><text x="43" y="427.0" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#FF7A36">02</text><text x="43" y="456.0" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="400" fill="#FFF7EF">Find the essentials</text><text x="43" y="480.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#C9C9C9">Lights, wipers and parking controls</text><rect x="24" y="514" width="342" height="100" rx="20" fill="url(#glass)"/><text x="43" y="544.0" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#FF7A36">03</text><text x="43" y="573.0" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="400" fill="#FFF7EF">Connect if you want</text><text x="43" y="597.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#C9C9C9">Audio pairing stays optional</text><text x="24" y="657.0" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#C9C9C9">Your phone prepares you. The parked car</text><text x="24" y="677.25" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#C9C9C9">guides the adjustments.</text><rect x="24" y="718" width="342" height="58" rx="18" fill="url(#sun)"/><text x="195" text-anchor="middle" y="754.0" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" fill="#101010">Preview the control guide</text><rect x="130" y="822" width="130" height="4" rx="2" fill="#FFF7EF"/></svg>