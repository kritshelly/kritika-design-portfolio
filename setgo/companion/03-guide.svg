<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><defs><linearGradient id="sun" x2="1" y2="1"><stop stop-color="#FFD5BB"/><stop offset=".55" stop-color="#FF7A36"/><stop offset="1" stop-color="#FF642D"/></linearGradient><linearGradient id="glass" x2="1" y2="1"><stop stop-color="#353535"/><stop offset="1" stop-color="#191919"/></linearGradient></defs><rect x="0" y="0" width="390" height="844" rx="36" fill="#101010"/><text x="24" y="31.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#FFF7EF">9:41</text><text x="315" y="31.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#FFF7EF">● ▰</text><text x="24" y="88.0" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600" fill="#FFF7EF">SETGO /</text><text x="314" y="85.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#FFC49F">03 / 04</text><text x="24" y="150.0" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="500" fill="#FFF7EF">Know where to</text><text x="24" y="195.9" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="500" fill="#FFF7EF">reach.</text><text x="24" y="228.0" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#C9C9C9">A preview of the SETGO concept cockpit.</text><rect x="24" y="280" width="342" height="203" rx="20" fill="url(#glass)"/><g transform="translate(42 300) scale(.77)"><rect x="8" y="15" width="380" height="183" rx="32" fill="#101010" stroke="#555"/><circle cx="285" cy="100" r="48" fill="none" stroke="#FFF7EF" stroke-width="5"/><path d="M241 90 L280 115 L287 145 M322 92 L289 114" fill="none" stroke="#FFF7EF" stroke-width="4"/><rect x="90" y="66" width="90" height="65" rx="12" fill="#303030"/><rect x="336" y="87" width="32" height="12" rx="6" fill="#FF7A36"/><circle cx="353" cy="93" r="27" fill="none" stroke="#FF7A36" stroke-dasharray="4 4"/></g><text x="24" y="525.0" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="400" fill="#FFF7EF">Wipers</text><text x="24" y="558.0" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" fill="#C9C9C9">Find the stalk to the right of the</text><text x="24" y="580.95" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" fill="#C9C9C9">steering wheel.</text><text x="24" y="626.0" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#FF7A36">Once inside</text><text x="24" y="654.0" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#C9C9C9">Locate the control while parked. Ask the</text><text x="24" y="674.25" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#C9C9C9">rental team if the vehicle differs.</text><rect x="24" y="718" width="342" height="58" rx="18" fill="url(#sun)"/><text x="195" text-anchor="middle" y="754.0" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" fill="#101010">Save my preparation</text><rect x="130" y="822" width="130" height="4" rx="2" fill="#FFF7EF"/></svg>