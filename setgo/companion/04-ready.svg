<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><defs><linearGradient id="sun" x2="1" y2="1"><stop stop-color="#FFD5BB"/><stop offset=".55" stop-color="#FF7A36"/><stop offset="1" stop-color="#FF642D"/></linearGradient><linearGradient id="glass" x2="1" y2="1"><stop stop-color="#353535"/><stop offset="1" stop-color="#191919"/></linearGradient></defs><rect x="0" y="0" width="390" height="844" rx="36" fill="#101010"/><text x="24" y="31.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#FFF7EF">9:41</text><text x="315" y="31.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#FFF7EF">● ▰</text><text x="24" y="88.0" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600" fill="#FFF7EF">SETGO /</text><text x="314" y="85.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#FFC49F">04 / 04</text><text x="24" y="150.0" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="500" fill="#FFF7EF">Prepared, at your</text><text x="24" y="195.9" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="500" fill="#FFF7EF">pace.</text><text x="24" y="228.0" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#C9C9C9">Your preview is saved on this phone.</text><rect x="24" y="284" width="342" height="142" rx="20" fill="url(#sun)"/><text x="44" y="325.0" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#101010">NEXT / IN THE CAR</text><text x="44" y="369.0" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="400" fill="#101010">Get comfortable.</text><text x="44" y="404.0" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" fill="#101010">Open SETGO while parked.</text><rect x="24" y="454" width="342" height="186" rx="20" fill="url(#glass)"/><text x="44" y="495.0" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="400" fill="#FFF7EF">What happens next</text><text x="44" y="533.0" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#C9C9C9">Adjust your seat and mirrors.</text><text x="44" y="554.6" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#C9C9C9">Explore the controls. Pair your</text><text x="44" y="576.2" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#C9C9C9">phone only if you choose.</text><text x="44" y="611.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#FFC49F">No preferences sent to the vehicle.</text><text x="24" y="679.0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#C9C9C9">A preview does not complete vehicle setup.</text><rect x="24" y="718" width="342" height="58" rx="18" fill="url(#sun)"/><text x="195" text-anchor="middle" y="754.0" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" fill="#101010">Review preparation</text><rect x="130" y="822" width="130" height="4" rx="2" fill="#FFF7EF"/></svg>