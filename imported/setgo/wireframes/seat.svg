<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><defs><linearGradient id="glass" x2="1" y2="1"><stop stop-color="#393939"/><stop offset="1" stop-color="#181818"/></linearGradient></defs><rect x="0" y="0" width="1280" height="800" rx="28" fill="#eeeeee" stroke="none"/><text x="40" y="54.0" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="600" fill="#333333">SETGO /</text><text x="1060" y="49.0" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="500" fill="#333333">PARK  •  09:41</text><rect x="40" y="80" width="1200" height="1" rx="0" fill="#333333" stroke="none"/><text x="40" y="125.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" fill="#333333">GET SET. THEN GO.</text><text x="40" y="202.0" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="500" fill="#333333">Your position comes first.</text><text x="42" y="302.0" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#333333">Use the physical controls on the outer side of your seat.</text><rect x="40" y="365" width="645" height="84" rx="16" fill="#eeeeee" stroke="#333333"/><text x="60" y="400.0" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="500" fill="#333333">Seat position</text><text x="60" y="426.0" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#333333">Adjust until the pedals and steering wheel are within comfortable</text><text x="60" y="446.48" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#333333">reach.</text><rect x="40" y="461" width="645" height="84" rx="16" fill="#eeeeee" stroke="#333333"/><text x="60" y="496.0" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="500" fill="#333333">Your confirmation</text><text x="60" y="522.0" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#333333">SETGO does not measure your seating position.</text><rect x="735" y="140" width="505" height="512" rx="24" fill="#eeeeee" stroke="none"/><text x="765" y="181.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" fill="#333333">YOUR SPACE / YOUR PACE</text><svg x="780" y="250" width="400" height="240" viewBox="0 0 400 240"><rect x="18" y="35" width="365" height="172" rx="35" fill="#101010" stroke="#494949" stroke-width="3"/><path d="M35 91 H365" stroke="#494949" stroke-width="3"/><rect x="80" y="99" width="97" height="57" rx="10" fill="#242424" stroke="#B9B9B9" stroke-width="2"/><circle cx="282" cy="126" r="49" fill="#242424" stroke="#C9C9C9" stroke-width="6"/><path d="M238 118 L272 134 L280 171 M323 118 L291 134" fill="none" stroke="#C9C9C9" stroke-width="5"/><rect x="186" y="110" width="34" height="25" rx="7" fill="#494949"/><rect x="335" y="112" width="32" height="10" rx="5" fill="#494949"/><rect x="191" y="160" width="26" height="33" rx="8" fill="#494949"/><path d="M281 14 V30" stroke="#FFD5BB" stroke-width="4"/></svg><text x="765" y="547.0" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" fill="#333333">01 / SEAT &amp; POSTURE</text><text x="765" y="584.0" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" fill="#333333">Illustrative vehicle layout. Follow the</text><text x="765" y="605.76" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" fill="#333333">handbook supplied with your car.</text><rect x="40" y="690" width="1200" height="1" rx="0" fill="#333333" stroke="none"/><rect x="40" y="710" width="112" height="64" rx="14" fill="#eeeeee"/><text x="96.0" y="749" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" fill="#333333">Back</text><rect x="920" y="710" width="320" height="64" rx="14" fill="#333333"/><text x="1080.0" y="749" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" fill="#eeeeee">I have adjusted my seat</text><rect x="180" y="710" width="380" height="64" rx="14" fill="#eeeeee"/><text x="370.0" y="749" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" fill="#333333">Back to setup</text><text x="750" y="750.0" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#333333">1 / 5</text></svg>