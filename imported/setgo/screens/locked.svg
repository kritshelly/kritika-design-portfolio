<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><defs><linearGradient id="glass" x2="1" y2="1"><stop stop-color="#393939"/><stop offset="1" stop-color="#181818"/></linearGradient><linearGradient id="signature" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFD5BB"/><stop offset=".48" stop-color="#FF7A36"/><stop offset="1" stop-color="#FF642D"/></linearGradient></defs><rect x="0" y="0" width="1280" height="800" rx="28" fill="#101010" stroke="none"/><text x="40" y="54.0" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="600" fill="#FFF7EF">SETGO /</text><text x="1060" y="49.0" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="500" fill="#FFC49F">NOT IN PARK  •  09:41</text><rect x="40" y="80" width="1200" height="1" rx="0" fill="#494949" stroke="none"/><text x="40" y="125.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" fill="#C9C9C9">GET SET. THEN GO.</text><text x="40" y="202.0" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="500" fill="#FFF7EF">Setup is paused.</text><text x="42" y="302.0" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#C9C9C9">Return to Park before using the setup guide.</text><rect x="735" y="140" width="505" height="512" rx="24" fill="url(#glass)" stroke="none"/><text x="765" y="181.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" fill="#C9C9C9">YOUR SPACE / YOUR PACE</text><text x="775" y="376.0" font-family="Inter,Arial,sans-serif" font-size="56" font-weight="500" fill="#F3BE68">In Park only</text><text x="775" y="454.0" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400" fill="#C9C9C9">Setup controls are unavailable</text><text x="775" y="482.16" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400" fill="#C9C9C9">outside Park.</text><rect x="40" y="690" width="1200" height="1" rx="0" fill="#494949" stroke="none"/><rect x="920" y="710" width="320"